services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in environment}
      - POSTGRES_DB=${POSTGRES_DB:-foms_ai_results}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - foms-network

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@foms.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in environment}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - foms-network

  mongodb:
    image: mongo:6.0
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in environment}
      - MONGO_INITDB_DATABASE=${MONGO_DB:-foms_trends_db}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - foms-network

  foms-api:
    build:
      context: ./foms-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__FomsSqlServer=${ConnectionStrings__FomsSqlServer:?Set ConnectionStrings__FomsSqlServer in environment}
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection:?Set ConnectionStrings__DefaultConnection in environment}
      - JwtSettings__Secret=${JWT_SECRET:?Set JWT_SECRET in environment (must be at least 32 characters)}
      - JwtSettings__Issuer=FOMS.Api
      - JwtSettings__Audience=FOMS.Api
      - AiService__InboundApiKey=${AI_SERVICE_API_KEY:?Set AI_SERVICE_API_KEY in environment}
      - FOMS_AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:?Set AI_SERVICE_API_KEY in environment}
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:?Set AI_SERVICE_API_KEY in environment}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - foms-network
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:?Set AI_SERVICE_API_KEY in environment}
      - FOMS_AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:?Set AI_SERVICE_API_KEY in environment}
      - POSTGRES_CONNECTION_STRING=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-foms_ai_results}
      - MONGODB_URI=mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB:-foms_trends_db}?authSource=admin
      - FOMS_BACKEND_URL=http://foms-api:8080
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:4173,http://localhost:5000
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - foms-network
    restart: unless-stopped

  ai-gateway:
    build:
      context: ./ai-gateway
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:?Set AI_SERVICE_API_KEY in environment}
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in environment (must be at least 32 characters)}
      - JWT_ISSUER=FOMS.Api
      - JWT_AUDIENCE=FOMS.Api
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:4173
    depends_on:
      - ai-service
    networks:
      - foms-network
    restart: unless-stopped

volumes:
  postgres-data:
  mongodb-data:

networks:
  foms-network:
    driver: bridge
