name: Frontend Test Suite

on:
  push:
    paths:
      - 'foms-frontend/**'
      - '.github/workflows/frontend_tests.yml'
  pull_request:
    paths:
      - 'foms-frontend/**'
      - '.github/workflows/frontend_tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: foms-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: foms-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test
