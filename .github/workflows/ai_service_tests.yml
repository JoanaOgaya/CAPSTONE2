name: AI Service Test Suite

on:
  push:
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai_service_tests.yml'
  pull_request:
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai_service_tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-service/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run pytest
        env:
          FOMS_ENV: testing
          AI_SERVICE_API_KEY: ci-test-key-32characters-minimum-length
        run: |
          cd ai-service
          python -m pytest tests -v
